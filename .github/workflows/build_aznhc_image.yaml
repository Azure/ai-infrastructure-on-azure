name: Build & Push AZNHC Container Image

on:
  push:
    branches:
      - main
    paths:
      - infrastructure_validations/aks/NHC/docker/Dockerfile
      - infrastructure_validations/aks/NHC/docker/aznhc_entrypoint.sh
      - .github/workflows/build_aznhc_image.yaml

  workflow_dispatch:

jobs:
  build_push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tag
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/azure/ai-infrastructure-on-azure/aznhc
          tags: |
            type=raw,value=latest
            type=schedule,pattern={{date 'YYYYMMDD-hhmmss' tz='Europe/London'}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infrastructure_validations/aks/NHC/docker
          file: infrastructure_validations/aks/NHC/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: ${{ steps.tag.outputs.labels }}
